name: Release

on:
  push:
    tags:
      - 'v*'
  # Started by release-please.yml with --ref <tag>: tags that release-please
  # creates do not fire the tag trigger above.
  workflow_dispatch:

jobs:
  # release-please creates the GitHub Release for its own tags, so a Release is
  # only made here for a tag pushed by hand.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    # A dispatch from a branch would publish that branch; only tags release.
    # On a dispatch the release job is skipped, which would skip this job too
    # unless the condition names a status itself.
    if: ${{ !cancelled() && needs.release.result != 'failure' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC publish (no NPM_TOKEN needed)
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        # prepack in package.json runs build:all automatically before packing
        run: |
          if [[ "${{ github.ref_name }}" == *-beta.* ]] || [[ "${{ github.ref_name }}" == *-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
